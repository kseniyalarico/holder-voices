name: Trigger Holder Voices indexers

# Vercel's free Hobby plan only allows cron jobs once per day, which is far
# too infrequent for near-real-time NFT/vote indexing. GitHub Actions'
# scheduled workflows (free for this public repo) fill the gap by hitting
# the same /api/cron/* routes every 5 minutes — the minimum interval GitHub
# supports for scheduled workflows.
#
# Each call only has ~60s (Vercel's function timeout) to work with. A large
# catch-up (e.g. right after first deploy) can span more than that, in which
# case the call times out — but sync progress is saved after every chunk, so
# it just resumes next tick. `continue-on-error` keeps that expected timeout
# from blocking the other indexer or marking the whole run as failed.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

# Never run two ticks at once — concurrent invocations were observed to
# double-count NFT transfers (read-then-write balance updates raced across
# overlapping calls). Queue instead of overlapping; don't cancel a run that's
# already progressing through a catch-up.
concurrency:
  group: holder-voices-indexers
  cancel-in-progress: false

jobs:
  trigger-indexers:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger NFT ownership indexer
        continue-on-error: true
        run: |
          curl -s -o /dev/null -w "nft-indexer: %{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.APP_URL }}/api/cron/nft-indexer"

      - name: Trigger vote indexer
        continue-on-error: true
        run: |
          curl -s -o /dev/null -w "vote-indexer: %{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.APP_URL }}/api/cron/vote-indexer"
